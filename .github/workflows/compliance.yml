name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libmpv-dev
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  ui-quality:
    name: UI component quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Run accessibility, geometry, locale, and visual component QA
        run: npm run ui:qa:visual
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-qa-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  source-and-dependencies:
    name: Windows native and source compliance
    # The committed license report includes platform-specific optional packages.
    # Generate and verify it on the project's Windows development target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run setup:mpv
      - run: npm run setup:twitch
      - name: Run native tests on Windows
        shell: pwsh
        run: |
          $env:PATH = "$(Resolve-Path 'src-tauri/lib/mpv-dev');$env:PATH"
          npm run test:rust
      - run: npm audit --audit-level=high
      - run: npm run licenses:check
      - run: npm run public-tree:check
      - name: Reject private media in Git history
        shell: bash
        run: |
          if git log --all --name-only --pretty=format: | grep -E '\.(m3u8?|xspf|xmltv|mp4|mkv|avi|mov|m4v|mp3|flac)$' | grep -Ev '^tests/fixtures/'; then
            echo 'Private playlists or bundled media remain in Git history.' >&2
            exit 1
          fi

  macos-native:
    name: macOS native tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install mpv
      - run: npm ci --ignore-scripts
      - run: npm run test:rust

  rust-dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml
